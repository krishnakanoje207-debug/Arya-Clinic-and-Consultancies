# LOCAL DEVELOPMENT ONLY — not used in production.
#
# The app uses Neon's HTTP driver (drizzle-orm/neon-http), which normally
# talks to a real *.neon.tech endpoint. To run against a local database with
# ZERO code differences from production, we put a Neon-compatible HTTP proxy
# in front of a stock Postgres container. src/db/index.js + migrate.js point
# the driver's fetch endpoint at this proxy when the DB host is db.localtest.me
# (which resolves to 127.0.0.1). In production the host is the real Neon
# endpoint and that branch is skipped.
#
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop + wipe the database volume

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    # Not published on the host — the app and migrations reach Postgres through
    # the neon-proxy (:4444) over Docker's internal network. Uncomment only if
    # you want to connect a local psql/GUI directly (and :5432 is free).
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - drseema_pgdata:/var/lib/postgresql/data

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  drseema_pgdata:
